[package]
name = "fuzzy-decision"
version = "0.5.0"
edition = "2021"
description = "Typed decisions (choice, score, noul) scored by Cloudflare's Clef-Flash on Burn's WGPU backend, with a text mode and an image mode."
authors = ["Richard Anaya"]
license = "MIT"
repository = "https://github.com/richardanaya/fuzzy-decision"
readme = "README.md"
# examples/corpus.rs is a module shared by domain_eval, not a target.
autoexamples = false

[[example]]
name = "domain_eval"

[[example]]
name = "vision_choice"

[[example]]
name = "vision_judge"

[[example]]
name = "vision_suite"

[[example]]
name = "image_eval"

[dependencies]
burn = { version = "0.21.0", default-features = false, features = ["std", "wgpu", "fusion"] }
burn-cubecl = { version = "0.21.0", default-features = false, features = ["fusion"] }
burn-fusion = { version = "0.21.0", default-features = false }
burn-ir = { version = "0.21.0", default-features = false }
burn-std = { version = "0.21.0", default-features = false }
cubecl = { version = "0.10.0", default-features = false, features = ["stdlib"] }
safetensors = "0.4"
thiserror = "2"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
burn = { version = "0.21.0", default-features = false, features = ["std", "wgpu", "ndarray", "fusion"] }
