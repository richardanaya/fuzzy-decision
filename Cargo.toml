[package]
name = "fuzzy-decision"
version = "0.6.0"
edition = "2021"
description = "Typed decisions (choice, score, noul) scored by Liquid AI's d1-omni-600M on Burn's WGPU backend, with text, audio, and image inputs."
authors = ["Richard Anaya"]
license = "MIT"
repository = "https://github.com/richardanaya/fuzzy-decision"
readme = "README.md"
# examples/corpus.rs is a module shared by domain_eval, not a target.
autoexamples = false

[[example]]
name = "domain_eval"

[[example]]
name = "vision_choice"

[[example]]
name = "vision_judge"

[[example]]
name = "vision_suite"

[[example]]
name = "image_eval"

[[example]]
name = "audio_decision"

[dependencies]
burn = { version = "0.21.0", default-features = false, features = ["std", "wgpu", "fusion"] }
hound = "3.5"
memmap2 = "0.9"
realfft = "3"
safetensors = "0.4"
serde_json = "1"
thiserror = "2"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
burn = { version = "0.21.0", default-features = false, features = ["std", "wgpu", "ndarray", "fusion"] }
